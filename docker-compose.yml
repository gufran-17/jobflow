services:

  mysql:
    image: mysql:8.0
    container_name: jobflow-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jobflow

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - jobflow-network


  backend:
    build:
      context: ./backend

    container_name: jobflow-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: jobflow
      FRONTEND_URL: http://localhost:5173

    depends_on:
      - mysql

    networks:
      - jobflow-network


  frontend:
    build:
      context: ./frontend

    container_name: jobflow-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:5000/api

    depends_on:
      - backend

    networks:
      - jobflow-network


volumes:
  mysql_data:


networks:
  jobflow-network:
    driver: bridge